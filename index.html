<script>
const toastEl=document.getElementById('toast');let toastTimer;
function toast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function go(page){const target=document.getElementById('page-'+page);if(!target){toast('This feature is coming soon.');return}document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p===target));document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('leftcol').classList.remove('mobile-open');window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){e.preventDefault();go(page.dataset.page)}const msg=e.target.closest('[data-toast]');if(msg)toast(msg.dataset.toast);const like=e.target.closest('.like-btn');if(like){const b=like.querySelector('b');const active=like.classList.toggle('liked');b.textContent=Number(b.textContent)+(active?1:-1);like.firstChild.textContent=active?'♥ Like ':'♡ Like '}const save=e.target.closest('.save-btn');if(save){const active=save.classList.toggle('saved');save.textContent=active?'✓ Saved':'♡ Save';toast(active?'Job saved.':'Job removed from saved items.');updateSaved()}const apply=e.target.closest('[data-apply]');if(apply)openApplicationForm(apply.dataset.apply);const connect=e.target.closest('.connect-btn,.connect-inline');if(connect){connect.textContent=connect.textContent.includes('Connected')?'＋ Connect':'✓ Connected';toast(connect.textContent.includes('Connected')?'Connection request sent.':'Connection request sent.')}});
document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('leftcol').classList.toggle('mobile-open'));
document.getElementById('leftCreate').addEventListener('click',()=>{go('home');document.getElementById('postInput').focus()});
document.getElementById('publishPost').addEventListener('click',()=>{const input=document.getElementById('postInput');const text=input.value.trim();if(!text){toast('Write something before posting.');input.focus();return}const article=document.createElement('article');article.className='card post';article.dataset.category='career';article.innerHTML='<div class="post-head"><div class="mini-avatar">LX</div><div class="post-person"><strong>You</strong><span>Just now</span></div></div><p class="post-text"></p><div class="post-actions"><div class="action-group"><button class="action-btn like-btn">♡ Like <b>0</b></button><button class="action-btn" data-toast="Comments are coming soon.">▢ Comment</button><button class="action-btn" data-toast="Post link copied.">↗ Share</button></div><span class="post-stats">New post</span></div>';article.querySelector('.post-text').textContent=text;document.getElementById('feedList').prepend(article);input.value='';toast('Your update has been added to this demo feed.')});
document.getElementById('feedTabs').addEventListener('click',e=>{const btn=e.target.closest('button[data-filter]');if(!btn)return;document.querySelectorAll('#feedTabs button').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('#feedList .post').forEach(p=>p.style.display=btn.dataset.filter==='all'||p.dataset.category===btn.dataset.filter?'':'none')});
function filterJobs(){const q=(document.getElementById('jobSearch').value||'').toLowerCase();const type=document.getElementById('jobType').value;let count=0;document.querySelectorAll('.job-card').forEach(card=>{const match=(card.dataset.search||'').includes(q)&& (type==='all'||card.dataset.type===type);card.style.display=match?'':'none';if(match)count++});let empty=document.getElementById('noJobs');if(!count&&!empty){empty=document.createElement('div');empty.id='noJobs';empty.className='card empty-state';empty.textContent='No jobs match your search yet.';document.getElementById('jobList').append(empty)}if(count&&empty)empty.remove()}
document.getElementById('jobSearch').addEventListener('input',filterJobs);document.getElementById('jobType').addEventListener('change',filterJobs);
document.getElementById('globalSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const jobMatch=[...document.querySelectorAll('.job-card')].some(j=>(j.dataset.search||'').includes(q));const postMatch=[...document.querySelectorAll('#feedList .post')].some(p=>p.textContent.toLowerCase().includes(q));if(jobMatch){go('jobs');document.getElementById('jobSearch').value=q;filterJobs()}else if(postMatch){go('home');document.querySelectorAll('#feedList .post').forEach(p=>p.style.display=p.textContent.toLowerCase().includes(q)?'':'none')}});

function ensureWorkflowForms(){
 let app=document.getElementById('applicationForm');
 if(!app){app=document.createElement('section');app.id='applicationForm';app.className='workflow-form';app.hidden=true;app.innerHTML='<h3>Apply for this role</h3><p class="form-help" id="applicationRole"></p><form id="applicationFormFields"><div class="form-grid"><div class="form-field"><label for="applicantName">Full name *</label><input id="applicantName" name="name" required autocomplete="name" maxlength="100"></div><div class="form-field"><label for="applicantEmail">Email address *</label><input id="applicantEmail" name="email" type="email" required autocomplete="email" maxlength="160"></div><div class="form-field full"><label for="applicantNote">Short introduction *</label><textarea id="applicantNote" name="note" required maxlength="1500" placeholder="Tell the team briefly why you’re a good fit."></textarea></div></div><div class="form-actions"><button type="button" class="secondary-btn" data-close-form="applicationForm">Cancel</button><button type="submit" class="primary-btn">Submit application</button></div><p class="form-help">Prototype only: this demo does not send your details to an employer.</p></form>';document.getElementById('jobList').before(app)}
 let job=document.getElementById('jobPostingForm');
 if(!job){job=document.createElement('section');job.id='jobPostingForm';job.className='workflow-form';job.hidden=true;job.innerHTML='<h3>Share a job opening</h3><p class="form-help">Add a role to the SIGHTX demo job board.</p><form id="jobPostingFields"><div class="form-grid"><div class="form-field"><label for="newJobTitle">Job title *</label><input id="newJobTitle" name="title" required maxlength="100"></div><div class="form-field"><label for="newJobCompany">Company *</label><input id="newJobCompany" name="company" required maxlength="100"></div><div class="form-field"><label for="newJobLocation">Location *</label><input id="newJobLocation" name="location" required maxlength="100" placeholder="e.g. Bengaluru · Hybrid"></div><div class="form-field"><label for="newJobType">Job type *</label><select id="newJobType" name="type" required><option>Full-time</option><option>Contract</option><option>Internship</option></select></div><div class="form-field"><label for="newJobExperience">Experience *</label><input id="newJobExperience" name="experience" required maxlength="60" placeholder="e.g. 2–4 years"></div><div class="form-field"><label for="newJobSalary">Salary / pay *</label><input id="newJobSalary" name="salary" required maxlength="60" placeholder="e.g. ₹10–15 LPA"></div><div class="form-field full"><label for="newJobDescription">Role description *</label><textarea id="newJobDescription" name="description" required maxlength="2000" placeholder="Responsibilities, skills, and what makes the role exciting…"></textarea></div></div><div class="form-actions"><button type="button" class="secondary-btn" data-close-form="jobPostingForm">Cancel</button><button type="submit" class="primary-btn">Publish job</button></div><p class="form-help">Prototype only: this job is added to this page session and is not published to a real hiring service.</p></form>';document.getElementById('jobList').before(job)}
}
function openApplicationForm(role){ensureWorkflowForms();const box=document.getElementById('applicationForm');document.getElementById('applicationRole').textContent=role;box.hidden=false;document.getElementById('jobPostingForm').hidden=true;box.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('applicantName').focus()}
document.getElementById('postJobCta').addEventListener('click',()=>{ensureWorkflowForms();const box=document.getElementById('jobPostingForm');box.hidden=false;document.getElementById('applicationForm').hidden=true;box.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('newJobTitle').focus()});
document.addEventListener('click',e=>{const close=e.target.closest('[data-close-form]');if(close){const box=document.getElementById(close.dataset.closeForm);if(box)box.hidden=true}});
document.addEventListener('submit',e=>{
 if(e.target.id==='applicationFormFields'){e.preventDefault();if(!e.target.reportValidity())return;const name=e.target.elements.namedItem('name').value.trim();const role=document.getElementById('applicationRole').textContent;document.getElementById('applicationForm').hidden=true;e.target.reset();toast('Demo application prepared for '+role+'. Nothing was sent.');return}
 if(e.target.id==='jobPostingFields'){e.preventDefault();if(!e.target.reportValidity())return;const f=e.target.elements;const values={title:f.namedItem('title').value.trim(),company:f.namedItem('company').value.trim(),location:f.namedItem('location').value.trim(),type:f.namedItem('type').value,experience:f.namedItem('experience').value.trim(),salary:f.namedItem('salary').value.trim(),description:f.namedItem('description').value.trim()};const card=document.createElement('article');card.className='card job-card';card.dataset.type=values.type;card.dataset.search=[values.title,values.company,values.location,values.type,values.experience,values.description].join(' ').toLowerCase();card.innerHTML='<div class="job-title-row"><h3></h3><span class="hiring">HIRING</span></div><div class="job-company"></div><div class="job-location"></div><div class="job-details"><span class="job-type"></span><span class="job-experience"></span><span class="salary"></span></div><p class="job-description"></p><div class="job-bottom"><span class="posted">Just added · Demo listing</span><div class="job-buttons"><button class="save-btn" type="button">♡ Save</button><button class="apply-job-btn" type="button">Apply now ↗</button></div></div>';card.querySelector('h3').textContent=values.title;card.querySelector('.job-company').textContent=values.company;card.querySelector('.job-location').textContent=values.location;card.querySelector('.job-type').textContent=values.type;card.querySelector('.job-experience').textContent=values.experience;card.querySelector('.salary').textContent=values.salary;card.querySelector('.job-description').textContent=values.description;card.querySelector('[type="button"].apply-job-btn').dataset.apply=values.title+' at '+values.company;document.getElementById('jobList').prepend(card);document.getElementById('jobPostingForm').hidden=true;e.target.reset();document.getElementById('jobSearch').value='';document.getElementById('jobType').value='all';filterJobs();toast('Job added to the demo board. It is not publicly published.');}
});

function updateSaved(){const saved=[...document.querySelectorAll('.job-card .save-btn.saved')].map(b=>b.closest('.job-card').querySelector('h3').textContent+' — '+b.closest('.job-card').querySelector('.job-company').textContent);const box=document.getElementById('savedList');box.className='card '+(saved.length?'':'empty-state');box.innerHTML=saved.length?saved.map(s=>'<div style="padding:15px;border-bottom:1px solid var(--line);font-size:12px">'+s+'</div>').join(''):'Save a job or post to find it here.'}
</script>
