<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a Job | SIGHTX</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17243a;background:#f4f7fc}*{box-sizing:border-box}body{margin:0;padding:28px 16px 60px}.top{max-width:820px;margin:0 auto 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:850;letter-spacing:-.04em;color:#123c70;text-decoration:none}.back{color:#174a86;text-decoration:none;font-weight:700}.wrap{max-width:820px;margin:auto}.eyebrow{color:#3268a8;font-size:12px;font-weight:800;letter-spacing:.13em}h1{margin:8px 0;font-size:clamp(28px,5vw,40px);letter-spacing:-.04em;color:#102d52}p{color:#63738a;line-height:1.6}.panel{margin-top:24px;padding:clamp(20px,4vw,34px);border:1px solid #dbe5f2;border-radius:20px;background:#fff;box-shadow:0 12px 32px rgba(20,48,88,.07)}h2{margin:0 0 8px;color:#173c6a}form{display:grid;gap:17px;margin-top:22px}label{display:grid;gap:7px;font-size:14px;font-weight:700;color:#283b55}input,select,textarea{width:100%;border:1px solid #ccd8e8;border-radius:10px;padding:12px 13px;font:inherit;color:#18283d;background:#fff}input:focus,select:focus,textarea:focus{outline:3px solid #dbeafe;border-color:#3975c9}textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:11px 18px;border:1px solid #174a86;border-radius:10px;background:#174a86;color:#fff;text-decoration:none;font:inherit;font-weight:750;cursor:pointer}.btn.secondary{background:#fff;color:#174a86;border-color:#cbd8e8}.notice{display:none;padding:12px;border-radius:10px;background:#edf8f0;color:#176438}.notice.show{display:block}@media(max-width:480px){body{padding:20px 13px 40px}.top{align-items:flex-start}.actions .btn{flex:1}}
</style></head><body>
<header class="top"><a class="brand" href="./index.html">SIGHTX</a><a class="back" href="./index.html#jobs">← Back to jobs</a></header>
<main class="wrap"><div class="eyebrow">GROW YOUR TEAM</div><h1>Post a Job</h1><p>Share an opening with the SIGHTX community.</p>
<section class="panel"><h2>Job details</h2><p>Provide the key information candidates need.</p><div id="notice" class="notice" role="status">Your job details have been completed. This demo does not publish or store job posts yet.</div>
<form id="jobForm"><label>Job title<input name="title" required></label><label>Company<input name="company" required></label><label>Location<input name="location" placeholder="City, remote, or hybrid" required></label><label>Employment type<select name="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></label><label>Job description<textarea name="description" placeholder="Responsibilities, requirements, and what you offer." required></textarea></label><label>Application email<input name="email" type="email" placeholder="hiring@company.com" required></label><div class="actions"><a class="btn secondary" href="./index.html#jobs">Cancel</a><button class="btn" type="submit">Publish Job</button></div></form></section></main>
<script>document.getElementById('jobForm').addEventListener('submit',e=>{e.preventDefault();if(!e.target.reportValidity())return;document.getElementById('notice').classList.add('show');e.target.reset();});</script>
</body></html>
<style>
/* Use the site's clean white-and-dark-blue button style on job forms. */
.btn:not(.secondary){
  background:#fff!important;
  color:#123c70!important;
  border:1px solid #b8cbe2!important;
  box-shadow:0 2px 6px rgba(16,45,82,.06)!important;
}
.btn:not(.secondary):hover{
  background:#f0f5fb!important;
  border-color:#174a86!important;
  box-shadow:0 4px 10px rgba(16,45,82,.10)!important;
}
.btn.secondary{
  background:#fff!important;
  color:#123c70!important;
  border:1px solid #cbd8e8!important;
}
.btn.secondary:hover{background:#f4f7fc!important;border-color:#9db4d2!important}
</style>


<style>
/* Primary form actions match the blue Apply buttons on the main Jobs page. */
.btn:not(.secondary){
  color:#fff!important;
  background:linear-gradient(120deg,#1748cf,#3478ff)!important;
  border:1px solid #1748cf!important;
  box-shadow:0 4px 10px rgba(37,99,235,.18)!important;
}
.btn:not(.secondary):hover{
  color:#fff!important;
  background:linear-gradient(120deg,#123db5,#2563eb)!important;
  border-color:#123db5!important;
  box-shadow:0 6px 14px rgba(37,99,235,.24)!important;
}
</style>
