name: Auth portal static checks

on:
  pull_request:
    branches: [main]
    paths:
      - "auth.html"
      - "index.html"
      - "apply-now.html"
      - ".github/workflows/auth-static-checks.yml"
      - "supabase/migrations/**/*.sql"
      - "supabase/schema.sql"
  push:
    branches: [main, "feature/account-authenticator-setup"]
    paths:
      - "auth.html"
      - "index.html"
      - "apply-now.html"
      - ".github/workflows/auth-static-checks.yml"
      - "supabase/migrations/**/*.sql"
      - "supabase/schema.sql"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate auth.html and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('auth.html', 'utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) {
            console.error('Duplicate HTML IDs:', [...new Set(duplicates)].join(', '));
            process.exit(1);
          }

          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(s => s.trim());
          if (!scripts.length) throw new Error('No inline JavaScript found');
          for (const [index, script] of scripts.entries()) {
            try { new Function(script); }
            catch (error) {
              console.error(`Inline script ${index + 1} has a syntax error:`, error.message);
              process.exit(1);
            }
          }

          const required = [
            'getAuthenticatorAssuranceLevel',
            'client.auth.mfa.enroll',
            'client.auth.mfa.challenge',
            'client.auth.mfa.verify',
            'mfaLoginChallenge',
            'We could not verify your sign-in security level',
            'Fail closed immediately'
          ];
          const missing = required.filter(text => !html.includes(text));
          if (missing.length) {
            console.error('Missing expected MFA flow elements:', missing.join(', '));
            process.exit(1);
          }
          const routeStart = html.indexOf('async function routeSession(nextSession)');
          const assuranceStart = html.indexOf('getAuthenticatorAssuranceLevel()', routeStart);
          const hideDashboardStart = html.indexOf("$('dashboard').classList.add('hidden')", routeStart);
          if (routeStart < 0 || assuranceStart < 0 || hideDashboardStart < 0 || hideDashboardStart > assuranceStart) {
            console.error('Session routing must hide the dashboard before awaiting MFA assurance.');
            process.exit(1);
          }
          if (/service_role/i.test(html)) {
            console.error('Potential service_role credential found in auth.html');
            process.exit(1);
          }
          console.log(`Static checks passed: ${ids.length} unique IDs, ${scripts.length} inline script(s), required MFA markers present.`);

          // The homepage is a multi-page UI shell and currently has repeated IDs
          // across separate page sections, so validate its inline JS syntax here
          // without failing on those existing markup IDs.
          const homepage = fs.readFileSync('index.html', 'utf8');
          const homepageScripts = [...homepage.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(s => s.trim());
          if (!homepageScripts.length) throw new Error('No inline JavaScript found in index.html');
          for (const [index, script] of homepageScripts.entries()) {
            try { new Function(script); }
            catch (error) {
              console.error(`index.html inline script ${index + 1} has a syntax error:`, error.message);
              process.exit(1);
            }
          }
          console.log(`Homepage JavaScript syntax passed: ${homepageScripts.length} inline script(s).`);
          // Validate actual HTML markup IDs separately from script templates,
          // which may contain fallback markup strings that are not in the DOM.
          for (const file of ['index.html', 'apply-now.html']) {
            const source = fs.readFileSync(file, 'utf8')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '')
              .replace(/<!--[ \s\S]*?-->/g, '');
            const markupIds = [...source.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
            const duplicates = [...new Set(markupIds.filter((id, index) => markupIds.indexOf(id) !== index))];
            if (duplicates.length) {
              console.error(file + ' has duplicate IDs in actual markup:', duplicates.join(', '));
              process.exit(1);
            }
            console.log(file + ': ' + markupIds.length + ' markup IDs are unique.');
          }
          const standaloneApply = fs.readFileSync('apply-now.html', 'utf8');
          const standaloneScripts = [...standaloneApply.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1])
            .filter(s => s.trim());
          if (!standaloneScripts.length) throw new Error('No inline JavaScript found in apply-now.html');
          for (const [index, script] of standaloneScripts.entries()) {
            try { new Function(script); }
            catch (error) {
              console.error(`apply-now.html inline script ${index + 1} has a syntax error:`, error.message);
              process.exit(1);
            }
          }
          if (!standaloneApply.includes('This standalone page is a preview only') ||
              !standaloneApply.includes('Nothing has been submitted or saved') ||
              !standaloneApply.includes('./auth.html')) {
            console.error('Standalone apply page must clearly disclose preview-only behavior and link to the real account portal.');
            process.exit(1);
          }
          console.log(`Standalone application preview syntax passed: ${standaloneScripts.length} inline script(s).`);

          // Guard the live job application flow and the canonical security schema.
          const applicationMarkers = [
            "data-live-apply",
            "client.auth.getSession()",
            "client.storage.from('resumes').upload",
            "client.from('sightx_applications').insert",
            'applicant_phone:mobile',
            'applicant_profile:profileSnapshot',
            'meta.resume_path',
            "file.size>5*1024*1024"
          ];
          const missingApplicationMarkers = applicationMarkers.filter(text => !homepage.includes(text));
          if (missingApplicationMarkers.length) {
            console.error('Live application flow is missing expected safeguards:', missingApplicationMarkers.join(', '));
            process.exit(1);
          }
          if (/service_role/i.test(homepage)) {
            console.error('Potential service_role credential found in index.html');
            process.exit(1);
          }
          const accountPortal = fs.readFileSync('auth.html', 'utf8');
          if (!accountPortal.includes('full_name,applicant_phone,email') ||
              !accountPortal.includes('Contact details:</strong>') ||
              !accountPortal.includes('.map(escapeHtml).join(')) {
            console.error('Applicant dashboard must show safely escaped submitted contact details.');
            process.exit(1);
          }
          if (!accountPortal.includes('applicant_phone') || !accountPortal.includes('applicant_phone?')) {
            console.error('Employer application view must support displaying the applicant contact phone when available.');
            process.exit(1);
          }
          if (!accountPortal.includes("createSignedUrl") || !accountPortal.includes("client.storage.from('resumes')")) {
            console.error('Account portal must retain secure resume download support.');
            process.exit(1);
          }
          const schema = fs.readFileSync('supabase/schema.sql', 'utf8').toLowerCase();
          const schemaMarkers = [
            'sightx admins require aal2',
            'applicant_phone text',
            'applicants clean up unlinked own resumes',
            'applicants and verified job owners can read applications',
            "((select auth.jwt()) -> 'app_metadata' ->> 'role')",
            'applicants and hiring teams read resumes',
            "split_part(resume_path, '/', 1)",
            'from public, anon, authenticated'
          ];
          const missingSchemaMarkers = schemaMarkers.filter(text => !schema.includes(text));
          if (missingSchemaMarkers.length) {
            console.error('Canonical schema is missing expected security controls:', missingSchemaMarkers.join(', '));
            process.exit(1);
          }
          if (homepage.includes("Your application for '+role+' is complete.")) {
            console.error('Homepage must not contain the legacy fake-success application handler.');
            process.exit(1);
          }
          const resumeCleanupMigration = fs.readFileSync('supabase/migrations/20261026100000_cleanup_unlinked_resumes.sql', 'utf8');
          if (!resumeCleanupMigration.includes('Applicants clean up unlinked own resumes') ||
              !resumeCleanupMigration.includes('not exists') ||
              !resumeCleanupMigration.includes('a.resume_path = objects.name')) {
            console.error('Resume cleanup migration must only allow deletion of unlinked own-folder resume objects.');
            process.exit(1);
          }
          console.log('Live application flow and canonical security schema checks passed.');

          // Guard the high-risk authorization invariants in security migrations.
          const migrationDir = 'supabase/migrations';
          if (fs.existsSync(migrationDir)) {
            const migrationFiles = fs.readdirSync(migrationDir)
              .filter(name => name.endsWith('.sql'))
              .map(name => ({ name, sql: fs.readFileSync(migrationDir + '/' + name, 'utf8').toLowerCase() }));
            for (const migration of migrationFiles) {
              if (migration.name.includes('require_aal2_for_admin_resume_access')) {
                for (const marker of ["'app_metadata' ->> 'role') = 'admin'", "'aal') = 'aal2'", "verification_status = 'verified'"]) {
                  if (!migration.sql.includes(marker)) {
                    console.error(`Security migration ${migration.name} is missing expected marker: ${marker}`);
                    process.exit(1);
                  }
                }
              }
              if (migration.name.includes('limit_application_reads_to_verified_employers')) {
                for (const marker of ["applicant_id = (select auth.uid())", "verification_status = 'verified'", "'app_metadata' ->> 'role') = 'admin'"]) {
                  if (!migration.sql.includes(marker)) {
                    console.error(`Security migration ${migration.name} is missing expected marker: ${marker}`);
                    process.exit(1);
                  }
                }
              }
              if (migration.name.includes('validate_applicant_resume_path')) {
                for (const marker of ["applicant_id = (select auth.uid())", "resume_path is null", "split_part(resume_path, '/', 1) = (select auth.uid())::text", "j.status = 'published'", "e.verification_status = 'verified'"]) {
                  if (!migration.sql.includes(marker)) {
                    console.error(`Security migration ${migration.name} is missing expected marker: ${marker}`);
                    process.exit(1);
                  }
                }
              }
              if (migration.name.includes('minimize_sightx_table_grants')) {
                for (const marker of ["revoke all privileges on table", "from public, anon, authenticated", "grant select on table public.sightx_job_listings to anon", "grant select, insert, update on table", "to authenticated"]) {
                  if (!migration.sql.includes(marker)) {
                    console.error(`Security migration ${migration.name} is missing expected marker: ${marker}`);
                    process.exit(1);
                  }
                }
                if (/grant\s+all\s+privileges|grant\s+truncate/i.test(migration.sql)) {
                  console.error(`Security migration ${migration.name} must not grant broad or TRUNCATE privileges.`);
                  process.exit(1);
                }
              }
            }
          }
          NODE
